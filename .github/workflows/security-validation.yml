name: Security dependency validation

on:
  push:
    branches: [ "security/upgrade-mocha-advisories" ]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: iosSimulatorArm64Test
            os: macos-latest
          - target: testDebugUnitTest
            os: ubuntu-latest
          - target: testReleaseUnitTest
            os: ubuntu-latest
          - target: jsNodeTest
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - run: ./gradlew ${{ matrix.target }}
      - if: matrix.target == 'jsNodeTest'
        run: |
          printf '%s\n' "describe('serialization', () => { it('runs in parallel', () => {}); });" > "$RUNNER_TEMP/mocha-parallel-test.cjs"
          node build/js/node_modules/mocha/bin/mocha.js --parallel "$RUNNER_TEMP/mocha-parallel-test.cjs"
