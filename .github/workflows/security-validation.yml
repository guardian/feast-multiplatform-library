name: Security dependency validation

on:
  push:
    branches: [ "security/upgrade-mocha-advisories" ]

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - run: ./gradlew kotlinUpgradeYarnLock
      - uses: actions/upload-artifact@v4
        with:
          name: kotlin-js-lockfile
          path: kotlin-js-store/yarn.lock

  test:
    needs: lockfile
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: iosSimulatorArm64Test
            os: macos-latest
          - target: testDebugUnitTest
            os: ubuntu-latest
          - target: testReleaseUnitTest
            os: ubuntu-latest
          - target: jsNodeTest
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/download-artifact@v4
        with:
          name: kotlin-js-lockfile
          path: kotlin-js-store
      - run: ./gradlew ${{ matrix.target }}
