name: Regular drift detection
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-schema-drift:
    name: "Check GraphQL Schema Drift"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install graphql-inspector
        run: npm install -g @graphql-inspector/cli

      - name: Check GraphQL schema drift
        id: drift_check
        env:
          FEAST_GRAPHQL_INTROSPECTION_URL: ${{ vars.FEAST_GRAPHQL_INTROSPECTION_URL }}
        run: |
          if ! npx graphql-inspector diff ${FEAST_GRAPHQL_INTROSPECTION_URL} backend/graphql/src/commonMain/graphql/schema.graphqls --fail-on-breaking; then
            ./gradlew :backend:graphql:downloadFeastApolloSchemaFromIntrospection
            echo "drift_detected=true" >> "$GITHUB_OUTPUT"
          else
            echo "drift_detected=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for schema file changes
        id: schema_changes
        if: steps.drift_check.outputs.drift_detected == 'true'
        run: |
          if git diff --quiet -- backend/graphql/src/commonMain/graphql/schema.graphqls; then
            echo "schema_updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "schema_updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for existing schema update PR
        id: existing_pr
        if: steps.schema_changes.outputs.schema_updated == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const head = `${owner}:automation/schema-drift-update`;
            const response = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              base: 'main',
              head,
              per_page: 1
            });
            core.setOutput('exists', response.data.length > 0 ? 'true' : 'false');

      - name: Create schema update PR
        if: steps.schema_changes.outputs.schema_updated == 'true' && steps.existing_pr.outputs.exists == 'false'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: automation/schema-drift-update
          base: main
          commit-message: "chore(graphql): update schema from introspection"
          title: "chore(graphql): update schema from drift detection"
          body: |
            Automated GraphQL schema update generated by weekly drift detection.

            - Source: `${{ vars.FEAST_GRAPHQL_INTROSPECTION_URL }}`
            - File: `backend/graphql/src/commonMain/graphql/schema.graphqls`
          add-paths: |
            backend/graphql/src/commonMain/graphql/schema.graphqls
