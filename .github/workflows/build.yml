name: Gradle tests and build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  check-schema-drift:
    name: "Check GraphQL Schema Drift"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Detect backend GraphQL changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend_graphql:
              - 'backend/graphql/src/commonMain/graphql/**'

      - name: Check GraphQL Schema Drift
        if: steps.changes.outputs.backend_graphql == 'true'
        env:
          FEAST_GRAPHQL_INTROSPECTION_URL: ${{ vars.FEAST_GRAPHQL_INTROSPECTION_URL }}
        run: |
          ./gradlew :backend:graphql:downloadFeastApolloSchemaFromIntrospection
          if ! git diff --exit-code src/commonMain/graphql/schema.graphqls; then
            if [ "${{ contains(github.event.pull_request.labels.*.name, 'schema-drift-expected') }}" = "true" ]; then
              echo "::warning::Schema differs from production, override label present."
            else
              exit 1
            fi
          fi

  build:
    strategy:
      matrix:
        include:
          - target: iosSimulatorArm64Test
            os: macos-latest
          - target: testDebugUnitTest
            os: ubuntu-latest
          - target: testReleaseUnitTest
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v3

    - name: Validate Gradle Wrapper
      uses: gradle/actions/wrapper-validation@v3
      continue-on-error: true

    - uses: actions/cache@v3
      with:
        path: |
          ~/.konan
        key: ${{ runner.os }}-${{ hashFiles('**/.lock') }}
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Build with Gradle
      uses: gradle/gradle-build-action@ce999babab2de1c4b649dc15f0ee67e6246c994f
      with:
        arguments: ${{ matrix.target }}

    - name: Upload Test Results
      if: (!cancelled())
      uses: actions/upload-artifact@v4
      with:
        name: Test Results (target ${{ matrix.target }})
        path: '**/build/test-results/*/*.xml'

  publish-test-results:
    name: "Publish Tests Results"
    needs: build
    runs-on: ubuntu-latest
    if: (!cancelled())

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: "artifacts/**/*.xml"

