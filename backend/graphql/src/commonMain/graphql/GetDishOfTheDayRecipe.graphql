query GetDishOfTheDayRecipe(
    $region: regions!,
    $edition: editions!,
    $alias: String!
) {
    Container: curatedContainerByAlias(region: $region, edition: $edition, alias: $alias) {
        title
        items {
            ... on RecipeReference {
                recipe {
                    title
                    featuredImage {
                        templateUrl
                        caption
                    }
                    id
                    diets
                }
            }
        }
    }
}